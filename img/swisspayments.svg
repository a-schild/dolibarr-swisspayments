<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 42 42" width="42" height="42" role="img" aria-label="Swiss QR-bill">
  <!-- White rounded card so the mark stays legible on light and dark themes -->
  <rect x="0.5" y="0.5" width="41" height="41" rx="6" ry="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <g fill="#1a1a1a">
    <!-- Finder patterns (three QR corners) -->
    <!-- top-left -->
    <path d="M4 4h12v12H4z M6 6v8h8V6z" fill-rule="evenodd"/>
    <rect x="8" y="8" width="4" height="4"/>
    <!-- top-right -->
    <path d="M26 4h12v12H26z M28 6v8h8V6z" fill-rule="evenodd"/>
    <rect x="30" y="8" width="4" height="4"/>
    <!-- bottom-left -->
    <path d="M4 26h12v12H4z M6 28v8h8v-8z" fill-rule="evenodd"/>
    <rect x="8" y="30" width="4" height="4"/>
    <!-- Data modules / timing to read as a QR code -->
    <rect x="18" y="4" width="2" height="2"/>
    <rect x="22" y="4" width="2" height="2"/>
    <rect x="20" y="6" width="2" height="2"/>
    <rect x="18" y="8" width="2" height="2"/>
    <rect x="22" y="10" width="2" height="2"/>
    <rect x="4" y="18" width="2" height="2"/>
    <rect x="8" y="18" width="2" height="2"/>
    <rect x="6" y="20" width="2" height="2"/>
    <rect x="10" y="22" width="2" height="2"/>
    <rect x="4" y="22" width="2" height="2"/>
    <rect x="36" y="18" width="2" height="2"/>
    <rect x="32" y="20" width="2" height="2"/>
    <rect x="36" y="22" width="2" height="2"/>
    <rect x="18" y="36" width="2" height="2"/>
    <rect x="22" y="36" width="2" height="2"/>
    <rect x="20" y="32" width="2" height="2"/>
    <rect x="24" y="34" width="2" height="2"/>
    <rect x="36" y="30" width="2" height="2"/>
    <rect x="34" y="34" width="2" height="2"/>
    <rect x="30" y="36" width="2" height="2"/>
  </g>
  <!-- Swiss cross emblem at the centre (marks a Swiss QR-bill) -->
  <rect x="14" y="14" width="14" height="14" rx="2" ry="2" fill="#e30613"/>
  <g fill="#ffffff">
    <rect x="19.5" y="16.5" width="3" height="9" rx="0.6"/>
    <rect x="16.5" y="19.5" width="9" height="3" rx="0.6"/>
  </g>
</svg>
